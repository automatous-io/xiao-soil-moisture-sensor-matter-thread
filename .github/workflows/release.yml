# Builds the firmware from a version tag and attaches the merged .bin and the
# Matter OTA image to a draft release. The draft stays invisible until the
# release notes are written and it is published by hand.
#
# A workflow_dispatch run builds and uploads both assets as workflow artifacts
# without touching releases, for testing the pipeline without a tag.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build firmware and release assets
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c6
          path: source
          command: >-
            idf.py build
            && python3 ../scripts/make-release-bin.py
            && python3 ../scripts/make-matter-ota.py

      # The scripts name their files from the firmware version. A mismatch
      # here means the tag and CHIPProjectConfig.h disagree; fix the source or
      # the tag, never the filename.
      - name: Check the asset names match the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -f "source/automatous-io-xiao-soil-moisture-sensor-${GITHUB_REF_NAME}.bin"
          test -f "source/automatous-io-xiao-soil-moisture-sensor-${GITHUB_REF_NAME}.ota"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            source/automatous-io-xiao-soil-moisture-sensor-*.bin
            source/automatous-io-xiao-soil-moisture-sensor-*.ota
          if-no-files-found: error

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            source/automatous-io-xiao-soil-moisture-sensor-*.bin
            source/automatous-io-xiao-soil-moisture-sensor-*.ota
